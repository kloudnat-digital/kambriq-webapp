name: CI

# ------------------------------------------------------------------------------
# Responsibilities:
#   1. Run quality checks (lint / typecheck / test) in parallel on every push
#      and PR targeting develop or main.
#   2. Build and push API + Web Docker images to ECR on develop pushes only
#      (after all quality checks pass).
#   3. Trigger the deploy-dev workflow automatically once both images are ready.
#
# Production deploys workflow has been removed. Will be reintroduced for go-live.
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # -- Commit message validation (PR only) -------------------------------------
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # -- Parallel quality checks --------------------------------------------------
  quality:
    name: Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, typecheck:web, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.check == 'lint'
        run: pnpm run lint

      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: pnpm run typecheck

      - name: Typecheck web
        if: matrix.check == 'typecheck:web'
        run: pnpm run typecheck:web

      - name: Test with coverage
        if: matrix.check == 'test'
        run: pnpm run test:cov
        env:
          NX_SKIP_NX_CACHE: "true"

      - name: Upload coverage to Codecov
        if: matrix.check == 'test'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/apps/api/lcov.info,coverage/libs/common/lcov.info
          fail_ci_if_error: false

  # -- Build and push API image (develop push only) -----------------------------
  build-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    environment: dev
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPO: ${{ vars.ECR_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REPO }}:dev-latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # -- Build and push Web image (develop push only) -----------------------------
  build-web:
    name: Build & push Web image
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    environment: dev
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.ECR_WEB_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_WEB_REPO }}:web-dev-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # -- Auto-deploy to dev after successful builds -------------------------------
  deploy-dev:
    name: Deploy to dev
    needs: [build-api, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-dev.yml
    with:
      api_image_tag: ${{ needs.build-api.outputs.image_tag }}
      web_image_tag: ${{ needs.build-web.outputs.image_tag }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # -- E2E tests against deployed dev (post-deploy) -----------------------------
  e2e:
    name: E2E Tests (dev)
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report/
          retention-days: 7

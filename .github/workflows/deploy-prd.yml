name: Deploy Prd

# ------------------------------------------------------------------------------
# Triggered by release-please version tags (v*) on main, or manually.
#
# Flow:
#   1. Build image tagged as the semver version (GHA layer cache from develop
#      build makes this fast - most layers already cached).
#   2. Run migrations against production database.
#   3. Roll ECS service to new image.
#   4. Smoke test.
#
# To re-deploy an existing image without rebuilding, trigger manually and pass
# the exact image_tag (e.g. v1.2.3).
# ------------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. v1.2.3 or sha-abc1234). Leave empty to build from current commit."
        type: string
        default: ""

concurrency:
  group: deploy-prd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # -- Build (tag push) or re-use existing image (manual re-deploy) -------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: prd
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPO: ${{ vars.ECR_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate semver tag matches package.json
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ github.ref_name }}" != "v${VERSION}" ]]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version v${VERSION}" >&2
            exit 1
          fi

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.tag.outputs.build == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.tag.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -- Deploy --------------------------------------------------------------------
  deploy:
    name: Deploy to prd
    runs-on: ubuntu-latest
    needs: [build]
    environment: prd
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPO: ${{ vars.ECR_REPO }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'api' }}
      ASSIGN_PUBLIC_IP: ${{ vars.ASSIGN_PUBLIC_IP || 'DISABLED' }}
      SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image URI
        run: echo "IMAGE_URI=${ECR_REPO}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Register new task definition
        run: |
          set -euo pipefail
          TASK_DEF_JSON="$(aws ecs describe-task-definition --task-definition "${ECS_TASK_DEFINITION}")"
          NEW_TASK_DEF="$(echo "${TASK_DEF_JSON}" | jq --arg IMAGE "${IMAGE_URI}" --arg NAME "${CONTAINER_NAME}" '
            .taskDefinition
            | .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ')"
          NEW_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json "${NEW_TASK_DEF}" \
            --query "taskDefinition.taskDefinitionArn" --output text)"
          echo "NEW_TASK_DEF_ARN=${NEW_TASK_DEF_ARN}" >> "$GITHUB_ENV"

      - name: Run Prisma migrations
        run: |
          set -euo pipefail
          OVERRIDES="$(jq -nc --arg name "${CONTAINER_NAME}" '{
            containerOverrides: [{
              name: $name,
              environment: [{name: "ALLOW_DB_PUSH", value: "true"}],
              command: ["node", "prisma/run-migrations.js"]
            }]
          }')"
          TASK_ARN="$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=[${ECS_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --overrides "${OVERRIDES}" \
            --query "tasks[0].taskArn" --output text)"

          if [[ -z "${TASK_ARN}" || "${TASK_ARN}" == "None" ]]; then
            echo "Failed to start migration task" >&2; exit 1
          fi

          echo "Waiting for migration task ${TASK_ARN} to complete..."
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"

          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[0].exitCode" --output text)"
          echo "MIGRATION_TASK_ARN=${TASK_ARN}" >> "$GITHUB_ENV"
          echo "MIGRATION_EXIT_CODE=${EXIT_CODE}" >> "$GITHUB_ENV"

          if [[ "${EXIT_CODE}" != "0" ]]; then
            echo "Migration task failed with exit code ${EXIT_CODE}" >&2; exit 1
          fi

      - name: Deploy to ECS
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEW_TASK_DEF_ARN}"
          echo "Waiting for service to stabilise..."
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Smoke test
        if: env.SMOKE_TEST_URL != ''
        run: |
          set -euo pipefail
          TARGET_URL="${SMOKE_TEST_URL}"
          if ! curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${TARGET_URL}"; then
            echo "Smoke test failed on ${TARGET_URL} - trying ALB DNS fallback..."
            TG_ARN="$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
              --query "services[0].loadBalancers[0].targetGroupArn" --output text)"
            LB_ARN="$(aws elbv2 describe-target-groups \
              --target-group-arns "${TG_ARN}" \
              --query "TargetGroups[0].LoadBalancerArns[0]" --output text)"
            LB_DNS="$(aws elbv2 describe-load-balancers \
              --load-balancer-arns "${LB_ARN}" \
              --query "LoadBalancers[0].DNSName" --output text)"
            TARGET_URL="http://${LB_DNS}/api/v1/health/ready"
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${TARGET_URL}"
          fi
          echo "SMOKE_TEST_RESOLVED_URL=${TARGET_URL}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Playwright for post-deploy E2E
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
        working-directory: ${{ github.workspace }}

      - name: Run E2E tests against production
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          CI: "true"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prd
          path: apps/web-e2e/playwright-report/
          retention-days: 30

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deploy Prd"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_URI:-n/a}\` |"
            echo "| Task definition | \`${NEW_TASK_DEF_ARN:-n/a}\` |"
            echo "| Migration exit code | \`${MIGRATION_EXIT_CODE:-n/a}\` |"
            [[ -n "${SMOKE_TEST_URL:-}" ]] && echo "| Smoke test | ${SMOKE_TEST_RESOLVED_URL:-${SMOKE_TEST_URL}} |"
          } >> "$GITHUB_STEP_SUMMARY"

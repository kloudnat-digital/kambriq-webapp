name: Migrate Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    name: One-off Prisma Migrations
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'api' }}
      ASSIGN_PUBLIC_IP: ${{ vars.ASSIGN_PUBLIC_IP || 'DISABLED' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Prisma migrations (one-off task)
        run: |
          set -euo pipefail
          TASK_ARN="$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --network-configuration "awsvpcConfiguration={subnets=[${ECS_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --overrides "$(cat <<EOF
          {
            "containerOverrides": [
              {
                "name": "${CONTAINER_NAME}",
                "command": [
                  "sh",
                  "-c",
                  "npx prisma migrate deploy --schema prisma/core/schema.prisma --config prisma/core/prisma.config.ts && npx prisma migrate deploy --schema prisma/kbs/schema.prisma --config prisma/kbs/prisma.config.ts"
                ]
              }
            ]
          }
          EOF
          )" \
            --query "tasks[0].taskArn" \
            --output text)"

          if [[ -z "${TASK_ARN}" || "${TASK_ARN}" == "None" ]]; then
            echo "Failed to start migration task" >&2
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"
          EXIT_CODE="$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[0].exitCode" --output text)"
          echo "MIGRATION_TASK_ARN=${TASK_ARN}" >> "$GITHUB_ENV"
          echo "MIGRATION_EXIT_CODE=${EXIT_CODE}" >> "$GITHUB_ENV"

          if [[ "${EXIT_CODE}" != "0" ]]; then
            echo "Migration task failed with exit code ${EXIT_CODE}" >&2
            exit 1
          fi

      - name: Migration summary
        if: always()
        run: |
          {
            echo "## Migration Dev Summary"
            echo
            echo "- Migration task: ${MIGRATION_TASK_ARN:-n/a}"
            echo "- Migration exit code: ${MIGRATION_EXIT_CODE:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

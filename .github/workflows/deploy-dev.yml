name: Deploy Dev

# ------------------------------------------------------------------------------
# Pure deploy workflow - no build step.
# Called automatically by ci.yml after a successful image build on develop,
# or triggered manually from the UI with explicit image tags.
#
# Expected runtime: 3-6 min (migrate + ECS rolling updates for API + web).
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      api_image_tag:
        description: "ECR API image tag (e.g. sha-abc1234)"
        type: string
        required: true
      web_image_tag:
        description: "ECR Web image tag (e.g. sha-abc1234)"
        type: string
        required: true
      run_seed:
        description: "Run database seed (first deploy only)"
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: "ECR API image tag (e.g. sha-abc1234 or dev-latest)"
        type: string
        required: true
      web_image_tag:
        description: "ECR Web image tag (e.g. sha-abc1234 or web-dev-latest)"
        type: string
        required: true
      run_seed:
        description: "Run database seed (first deploy only)"
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPO: ${{ vars.ECR_REPO }}
      ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_WEB_TASK_DEFINITION: ${{ vars.ECS_WEB_TASK_DEFINITION }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'api' }}
      WEB_CONTAINER_NAME: ${{ vars.WEB_CONTAINER_NAME || 'web' }}
      ASSIGN_PUBLIC_IP: ${{ vars.ASSIGN_PUBLIC_IP || 'DISABLED' }}
      SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
      # Version gate. Both are optional: VERSION_CHECK_URL defaults to the
      # smoke-test URL with /ready swapped for /version, WEB_HEALTH_URL falls
      # back to the public app URL already used by the e2e job.
      VERSION_CHECK_URL: ${{ vars.VERSION_CHECK_URL }}
      WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL || vars.NEXT_PUBLIC_APP_URL }}
      API_IMAGE_TAG: ${{ inputs.api_image_tag }}
      WEB_IMAGE_TAG: ${{ inputs.web_image_tag }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image URIs
        run: |
          echo "API_IMAGE_URI=${ECR_REPO}:${API_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_URI=${ECR_WEB_REPO}:${WEB_IMAGE_TAG}" >> "$GITHUB_ENV"

      # -- API: register task definition ----------------------------------------
      - name: Register API task definition
        run: |
          set -euo pipefail
          TASK_DEF_JSON="$(aws ecs describe-task-definition --task-definition "${ECS_TASK_DEFINITION}")"
          NEW_TASK_DEF="$(echo "${TASK_DEF_JSON}" | jq --arg IMAGE "${API_IMAGE_URI}" --arg NAME "${CONTAINER_NAME}" '
            .taskDefinition
            | .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ')"
          NEW_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json "${NEW_TASK_DEF}" \
            --query "taskDefinition.taskDefinitionArn" --output text)"
          echo "NEW_TASK_DEF_ARN=${NEW_TASK_DEF_ARN}" >> "$GITHUB_ENV"

      # -- Run Prisma migrations ------------------------------------------------
      - name: Run Prisma migrations
        run: |
          set -euo pipefail
          OVERRIDES="$(jq -nc --arg name "${CONTAINER_NAME}" '{
            containerOverrides: [{
              name: $name,
              environment: [{name: "ALLOW_DB_PUSH", value: "true"}],
              command: ["node", "prisma/run-migrations.js"]
            }]
          }')"
          TASK_ARN="$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=[${ECS_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --overrides "${OVERRIDES}" \
            --query "tasks[0].taskArn" --output text)"

          if [[ -z "${TASK_ARN}" || "${TASK_ARN}" == "None" ]]; then
            echo "Failed to start migration task" >&2; exit 1
          fi

          echo "Waiting for migration task ${TASK_ARN} to complete..."
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"

          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[0].exitCode" --output text)"
          echo "MIGRATION_TASK_ARN=${TASK_ARN}" >> "$GITHUB_ENV"
          echo "MIGRATION_EXIT_CODE=${EXIT_CODE}" >> "$GITHUB_ENV"

          if [[ "${EXIT_CODE}" != "0" ]]; then
            echo "Migration task failed with exit code ${EXIT_CODE}" >&2; exit 1
          fi

      # -- Seed: opt-in only (run_seed=true), first-deploy use-case ------------
      - name: Run database seed
        if: inputs.run_seed == true
        run: |
          set -euo pipefail
          OVERRIDES="$(jq -nc --arg name "${CONTAINER_NAME}" '{
            containerOverrides: [{
              name: $name,
              command: ["node", "prisma/run-migrations.js", "--seed"]
            }]
          }')"
          TASK_ARN="$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=[${ECS_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --overrides "${OVERRIDES}" \
            --query "tasks[0].taskArn" --output text)"

          if [[ -z "${TASK_ARN}" || "${TASK_ARN}" == "None" ]]; then
            echo "Failed to start seed task" >&2; exit 1
          fi

          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"
          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[0].exitCode" --output text)"

          if [[ "${EXIT_CODE}" != "0" ]]; then
            echo "Seed task failed with exit code ${EXIT_CODE}" >&2; exit 1
          fi

      # -- Deploy API service ---------------------------------------------------
      - name: Deploy API to ECS
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEW_TASK_DEF_ARN}"

          echo "Waiting for API service to stabilise (max 12 min)..."
          TIMEOUT=720 INTERVAL=15 ELAPSED=0
          while [[ $ELAPSED -lt $TIMEOUT ]]; do
            SVC="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
              --query "services[0]" --output json)"
            ROLLOUT="$(echo "${SVC}" | jq -r '.deployments[] | select(.status=="PRIMARY") | .rolloutState')"
            RUNNING="$(echo "${SVC}" | jq -r '.runningCount')"
            DESIRED="$(echo "${SVC}" | jq -r '.desiredCount')"
            echo "[${ELAPSED}s] API: running=${RUNNING}/${DESIRED} rollout=${ROLLOUT}"
            if [[ "${ROLLOUT}" == "COMPLETED" ]]; then echo "✓ API stable"; break; fi
            if [[ "${ROLLOUT}" == "FAILED" ]]; then
              echo "✗ API rollout FAILED - recent events:"; echo "${SVC}" | jq -r '.events[:5][]|.message'; exit 1
            fi
            sleep $INTERVAL; ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [[ $ELAPSED -ge $TIMEOUT ]]; then
            echo "✗ Timed out waiting for API service after ${TIMEOUT}s - recent events:"
            aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
              --query "services[0].events[:8]" --output table; exit 1
          fi

      # -- Web: register task definition and deploy -----------------------------
      - name: Register Web task definition
        if: env.ECS_WEB_SERVICE != '' && env.ECS_WEB_TASK_DEFINITION != ''
        run: |
          set -euo pipefail
          TASK_DEF_JSON="$(aws ecs describe-task-definition --task-definition "${ECS_WEB_TASK_DEFINITION}")"
          NEW_WEB_TASK_DEF="$(echo "${TASK_DEF_JSON}" | jq --arg IMAGE "${WEB_IMAGE_URI}" --arg NAME "${WEB_CONTAINER_NAME}" '
            .taskDefinition
            | .containerDefinitions |= map(
                if .name == $NAME
                then .image = $IMAGE | del(.healthCheck)
                else .
                end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ')"
          NEW_WEB_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json "${NEW_WEB_TASK_DEF}" \
            --query "taskDefinition.taskDefinitionArn" --output text)"
          echo "NEW_WEB_TASK_DEF_ARN=${NEW_WEB_TASK_DEF_ARN}" >> "$GITHUB_ENV"

      - name: Deploy Web to ECS
        if: env.ECS_WEB_SERVICE != '' && env.NEW_WEB_TASK_DEF_ARN != ''
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_WEB_SERVICE}" \
            --task-definition "${NEW_WEB_TASK_DEF_ARN}"

          echo "Waiting for Web service to stabilise (max 20 min)..."
          TIMEOUT=1200 INTERVAL=15 ELAPSED=0
          while [[ $ELAPSED -lt $TIMEOUT ]]; do
            SVC="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_WEB_SERVICE}" \
              --query "services[0]" --output json)"
            ROLLOUT="$(echo "${SVC}" | jq -r '.deployments[] | select(.status=="PRIMARY") | .rolloutState')"
            RUNNING="$(echo "${SVC}" | jq -r '.runningCount')"
            DESIRED="$(echo "${SVC}" | jq -r '.desiredCount')"
            echo "[${ELAPSED}s] Web: running=${RUNNING}/${DESIRED} rollout=${ROLLOUT}"
            if [[ "${ROLLOUT}" == "COMPLETED" ]]; then echo "✓ Web stable"; break; fi
            if [[ "${ROLLOUT}" == "FAILED" ]]; then
              echo "✗ Web rollout FAILED - recent events:"; echo "${SVC}" | jq -r '.events[:5][]|.message'
              # Show stopped task stop reason for root cause
              STOPPED="$(aws ecs list-tasks --cluster "${ECS_CLUSTER}" --service-name "${ECS_WEB_SERVICE}" \
                --desired-status STOPPED --query "taskArns[0]" --output text 2>/dev/null || true)"
              if [[ -n "${STOPPED}" && "${STOPPED}" != "None" ]]; then
                echo "--- Stopped task reason ---"
                aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${STOPPED}" \
                  --query "tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,exitCode:exitCode,reason:reason}}" \
                  --output json
              fi
              exit 1
            fi
            sleep $INTERVAL; ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [[ $ELAPSED -ge $TIMEOUT ]]; then
            echo "✗ Timed out waiting for Web service after ${TIMEOUT}s - recent events:"
            aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_WEB_SERVICE}" \
              --query "services[0].events[:8]" --output table
            # Dump stopped task reason so we know why health checks are failing
            STOPPED="$(aws ecs list-tasks --cluster "${ECS_CLUSTER}" --service-name "${ECS_WEB_SERVICE}" \
              --desired-status STOPPED --query "taskArns[0]" --output text 2>/dev/null || true)"
            if [[ -n "${STOPPED}" && "${STOPPED}" != "None" ]]; then
              echo "--- Most recent stopped task ---"
              aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${STOPPED}" \
                --query "tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,exitCode:exitCode,reason:reason}}" \
                --output json
            fi
            exit 1
          fi

      # -- Smoke test -----------------------------------------------------------
      - name: Smoke test
        if: env.SMOKE_TEST_URL != ''
        run: |
          set -euo pipefail
          TARGET_URL="${SMOKE_TEST_URL}"
          if ! curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${TARGET_URL}"; then
            echo "Smoke test failed on ${TARGET_URL} - trying ALB DNS fallback..."
            TG_ARN="$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
              --query "services[0].loadBalancers[0].targetGroupArn" --output text)"
            LB_ARN="$(aws elbv2 describe-target-groups \
              --target-group-arns "${TG_ARN}" \
              --query "TargetGroups[0].LoadBalancerArns[0]" --output text)"
            LB_DNS="$(aws elbv2 describe-load-balancers \
              --load-balancer-arns "${LB_ARN}" \
              --query "LoadBalancers[0].DNSName" --output text)"
            TARGET_URL="http://${LB_DNS}/api/v1/health/ready"
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${TARGET_URL}"
          fi
          echo "SMOKE_TEST_RESOLVED_URL=${TARGET_URL}" >> "$GITHUB_ENV"

      # -- Version gate ---------------------------------------------------------
      # The rollout reporting COMPLETED only means ECS started the new tasks. It
      # does not prove the ALB is serving them. Here we ask the running service
      # what image it is, and fail the deploy if it is not the one we deployed.
      # The tag is baked into the image at build time (docker/Dockerfile.*), so
      # an image cannot claim a tag it was not built as.
      - name: Verify API version
        run: |
          set -euo pipefail
          # Deliberately not guarded by an `if:`. A missing URL means we cannot
          # prove the deploy landed, and an unprovable deploy must fail rather
          # than skip - skipping is the silent pass this gate exists to close.
          # Note these are environment-scoped variables: they only resolve in a
          # job declaring `environment: dev`.
          if [[ -z "${VERSION_CHECK_URL:-}" && -z "${SMOKE_TEST_URL:-}" ]]; then
            echo "Neither VERSION_CHECK_URL nor SMOKE_TEST_URL is set for this environment," >&2
            echo "so the deployed version cannot be verified. Refusing to report success." >&2
            exit 1
          fi
          VERSION_URL="${VERSION_CHECK_URL:-${SMOKE_TEST_URL%/health/*}/health/version}"
          echo "Verifying ${VERSION_URL}"
          echo "Expecting imageTag=${API_IMAGE_TAG}"
          # A floating tag (dev-latest) never matches, because the image reports the
          # immutable sha tag it was built as. For those we assert only that the
          # service answers with real baked metadata, not the exact tag.
          case "${API_IMAGE_TAG}" in
            dev-latest|web-dev-latest|latest) STRICT=false ;;
            *) STRICT=true ;;
          esac
          echo "strict tag match: ${STRICT}"
          TIMEOUT=300 INTERVAL=10 ELAPSED=0 SERVED=""
          while [[ ${ELAPSED} -lt ${TIMEOUT} ]]; do
            BODY="$(curl -fsS --max-time 10 "${VERSION_URL}" 2>/dev/null || true)"
            SERVED="$(printf '%s' "${BODY}" | jq -r '.data.imageTag // .imageTag // empty' 2>/dev/null || true)"
            echo "[${ELAPSED}s] served imageTag=${SERVED:-<unreachable>}"
            if [[ "${STRICT}" == "false" && -n "${SERVED}" && "${SERVED}" != "unknown" ]] \
               || [[ "${SERVED}" == "${API_IMAGE_TAG}" ]]; then
              echo "API is serving ${SERVED}"
              echo "VERIFIED_API_TAG=${SERVED}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep ${INTERVAL}; ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "API version gate FAILED after ${TIMEOUT}s." >&2
          echo "  expected: ${API_IMAGE_TAG}" >&2
          echo "  served:   ${SERVED:-<endpoint unreachable>}" >&2
          echo "Likely causes: old tasks still receiving traffic, or the image was built without the build args." >&2
          echo "  (a floating tag only requires non-'unknown' metadata; a sha tag must match exactly)" >&2
          exit 1

      - name: Verify Web version
        run: |
          set -euo pipefail
          if [[ -z "${WEB_HEALTH_URL:-}" ]]; then
            echo "Neither WEB_HEALTH_URL nor NEXT_PUBLIC_APP_URL is set for this environment," >&2
            echo "so the deployed frontend cannot be verified. Refusing to report success." >&2
            exit 1
          fi
          WEB_URL="${WEB_HEALTH_URL%/}/health"
          if [[ -z "${NEW_WEB_TASK_DEF_ARN:-}" ]]; then
            echo "NOTE: no web task definition was registered this run (ECS_WEB_SERVICE or ECS_WEB_TASK_DEFINITION unset)."
            echo "      Checking the served frontend anyway - a stale tag here means the frontend was not deployed."
          fi
          echo "Verifying ${WEB_URL}"
          echo "Expecting imageTag=${WEB_IMAGE_TAG}"
          # A floating tag (dev-latest) never matches, because the image reports the
          # immutable sha tag it was built as. For those we assert only that the
          # service answers with real baked metadata, not the exact tag.
          case "${WEB_IMAGE_TAG}" in
            dev-latest|web-dev-latest|latest) STRICT=false ;;
            *) STRICT=true ;;
          esac
          echo "strict tag match: ${STRICT}"
          TIMEOUT=300 INTERVAL=10 ELAPSED=0 SERVED=""
          while [[ ${ELAPSED} -lt ${TIMEOUT} ]]; do
            BODY="$(curl -fsS --max-time 10 "${WEB_URL}" 2>/dev/null || true)"
            SERVED="$(printf '%s' "${BODY}" | jq -r '.imageTag // empty' 2>/dev/null || true)"
            echo "[${ELAPSED}s] served imageTag=${SERVED:-<unreachable>}"
            if [[ "${STRICT}" == "false" && -n "${SERVED}" && "${SERVED}" != "unknown" ]] \
               || [[ "${SERVED}" == "${WEB_IMAGE_TAG}" ]]; then
              echo "Web is serving ${SERVED}"
              echo "VERIFIED_WEB_TAG=${SERVED}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep ${INTERVAL}; ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Web version gate FAILED after ${TIMEOUT}s." >&2
          echo "  expected: ${WEB_IMAGE_TAG}" >&2
          echo "  served:   ${SERVED:-<endpoint unreachable>}" >&2
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deploy Dev"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| API image | \`${API_IMAGE_URI:-n/a}\` |"
            echo "| API task definition | \`${NEW_TASK_DEF_ARN:-n/a}\` |"
            echo "| Web image | \`${WEB_IMAGE_URI:-n/a}\` |"
            echo "| Web task definition | \`${NEW_WEB_TASK_DEF_ARN:-n/a}\` |"
            echo "| Migration exit code | \`${MIGRATION_EXIT_CODE:-n/a}\` |"
            echo "| API version verified | \`${VERIFIED_API_TAG:-not verified}\` |"
            echo "| Web version verified | \`${VERIFIED_WEB_TAG:-not verified}\` |"
            [[ -n "${SMOKE_TEST_URL:-}" ]] && echo "| Smoke test | ${SMOKE_TEST_RESOLVED_URL:-${SMOKE_TEST_URL}} |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Manual Deploy Dev

# ------------------------------------------------------------------------------
# Manually build and deploy a feature branch to dev for visual / smoke testing
# before merging the PR to develop.
#
# - Runs lint + web typecheck against the chosen branch.
# - Builds and pushes the Web image with a branch-tagged image tag.
# - Reuses the API image currently deployed to dev (no migration churn beyond
#   what `prisma migrate deploy` would do anyway, which is a no-op when the
#   schema hasn't changed).
# - Calls deploy-dev.yml to roll out the new Web image alongside the existing
#   API image.
# - Skips e2e on purpose - those run against develop after the squash merge.
#
# Usage:
#   gh workflow run manual-deploy-dev.yml --ref develop \
#     -f branch=feat/your-branch-here
# ------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build the Web image from (e.g. feat/design-system-refresh)"
        type: string
        required: true
      run_seed:
        description: "Run database seed (almost never needed)"
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

# ------------------------------------------------------------------------------
# WHERE THIS RUNS
#
# `runs-on` reads ONE repository variable, `CI_RUNNER_LABELS`, holding a JSON
# array of runner labels. Every job in every workflow uses the same expression,
# so the target lives in a single place outside the code.
#
#   set    ["self-hosted","macOS","ARM64","kambriq-ci"]   -> Visquis's Mac
#   unset  (or delete the variable)                       -> ubuntu-latest
#
# The `|| '["ubuntu-latest"]'` fallback is the point: an unset variable returns
# to GitHub-hosted runners rather than producing an empty `runs-on`, which is a
# job that fails for a reason nobody can read. October's reversal is deleting
# one variable in the repository settings - no PR, no code change, no rebuild.
# ------------------------------------------------------------------------------
jobs:
  quality:
    name: Quality / ${{ matrix.check }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck:web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.check == 'lint'
        run: pnpm run lint

      - name: Typecheck web
        if: matrix.check == 'typecheck:web'
        run: pnpm run typecheck:web

  build-web:
    name: Build & push Web image
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    needs: [quality]
    permissions:
      id-token: write
      contents: read
    environment: dev
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"
          BRANCH_SLUG="$(echo '${{ inputs.branch }}' | tr '/' '-' | tr -cd '[:alnum:]-' | cut -c1-30)"
          IMAGE_TAG="${BRANCH_SLUG}-${SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Fargate is amd64. The runner may not be.
          #
          # Without this line the build inherits the RUNNER's native
          # architecture: correct by accident on ubuntu-latest, and arm64 on
          # the self-hosted Mac - an image ECS cannot start. The failure does
          # not appear here; it appears minutes later as a task that stops with
          # an exec-format error, looking like a defect in the application.
          # Asserted against the registry in the step after this one, because
          # the flag being present is not proof the manifest carries it.
          platforms: linux/amd64
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.ECR_WEB_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # -- The pushed manifest must be amd64 ----------------------------------
      #
      # NOT a duplicate of a check that already exists somewhere - a check that
      # exists NOWHERE on this branch. `scripts/deploy-dev.sh` on develop is
      # still the stale 145-line orphan; PR #93 replaces it with the pipeline
      # that carries `assert_amd64`, and #93 is not merged.
      #
      # **When #93 lands this step must become a call to that function**, and
      # #93's own anti-drift test is what will say so - it fails on any workflow
      # step the script does not implement. Left inline here rather than left
      # out, because an unasserted image is how Fargate gets one it cannot start.
      #
      # `--verbose`: a single-platform push returns a v2 image manifest with no
      # `.manifests` array AND no top-level `.architecture` - the platform lives
      # in the config blob. Reading `.architecture` yields null for every
      # correctly built image, which is a gate that refuses everything.
      - name: Assert the pushed image is linux/amd64
        run: |
          set -euo pipefail
          URI="${{ env.ECR_WEB_REPO }}:${{ env.IMAGE_TAG }}"
          ARCH="$(docker manifest inspect --verbose "${URI}" \
            | jq -r '[ (if type == "array" then .[] else . end)
                       | .Descriptor.platform
                       | select(.os == "linux")
                       | .architecture ] | unique | join(" ")')"
          echo "${URI} -> architecture: ${ARCH:-<unreadable>}"
          if [ "${ARCH}" != "amd64" ]; then
            echo "::error::${URI} is ${ARCH:-unreadable}, not amd64. Fargate cannot start it." >&2
            exit 1
          fi

  resolve-api-tag:
    name: Resolve current API image tag
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: read
    environment: dev
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'api' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read current API image tag from ECS
        id: resolve
        run: |
          set -euo pipefail
          TASK_DEF_ARN="$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
            --query "services[0].taskDefinition" --output text)"
          IMAGE="$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_ARN}" \
            --query "taskDefinition.containerDefinitions[?name=='${CONTAINER_NAME}'].image" \
            --output text)"
          IMAGE_TAG="${IMAGE##*:}"
          echo "Current API image: ${IMAGE}"
          echo "Resolved API tag : ${IMAGE_TAG}"
          if [[ -z "${IMAGE_TAG}" || "${IMAGE_TAG}" == "${IMAGE}" ]]; then
            echo "Failed to resolve API image tag from current task definition" >&2
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to dev
    needs: [build-web, resolve-api-tag]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-dev.yml
    with:
      api_image_tag: ${{ needs.resolve-api-tag.outputs.image_tag }}
      web_image_tag: ${{ needs.build-web.outputs.image_tag }}
      run_seed: ${{ inputs.run_seed }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

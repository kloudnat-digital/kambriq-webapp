# Ruff configuration for KAMBRIQ API
# Ruff remplace black + flake8 + isort

# Version de ruff
ruff_version = "0.1.15"

# Configuration du formatage (style black)
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Longueur de ligne maximale (au niveau racine)
line-length = 100

# Configuration du linting
[lint]
# Activer tous les règles par défaut
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]

# Ignorer certaines règles si nécessaire
ignore = [
    "E501",  # Line too long (géré par le formatage)
    "B008",  # Do not perform function calls in argument defaults (souvent nécessaire pour dataclasses)
    "ARG001", # Unused function argument (utilisé dans les interfaces ABC)
    "ARG002", # Unused method argument
]

# Exclure certains fichiers/répertoires
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    ".env",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "alembic/versions",
]

# Configuration spécifique pour les imports
[lint.isort]
known-first-party = ["src"]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # Permettre arguments non utilisés dans les tests
    "S101", # Permettre assert dans les tests
]


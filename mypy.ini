# MyPy configuration for KAMBRIQ API
[mypy]
# Mode strict avec quelques exceptions
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Ignorer les imports manquants pour les dépendances externes (seront installées plus tard)
ignore_missing_imports = True

# Exclure certains répertoires
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "venv/",
    "env/",
    ".pytest_cache/",
    ".mypy_cache/",
    "alembic/versions/",
]

# Configuration par répertoire
[mypy-tests.*]
# Tests peuvent être moins stricts
disallow_untyped_defs = False

[mypy-alembic.*]
# Alembic génère du code dynamique
ignore_errors = True


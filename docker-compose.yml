version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kambriq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kambriq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kambriq-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kambriq-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/kambriq_db
      JWT_SECRET: ${JWT_SECRET:-6Vw588x1LSwJucHzqUTUgbpyF3YDVHyv24qJbJEmLiwZpTicq0HNX9EHjG0NJ}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      ENV: ${ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    networks:
      - kambriq-network
    command: uvicorn src.presentation.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  kambriq-network:
    driver: bridge


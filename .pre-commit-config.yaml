# Pre-commit hooks configuration for KAMBRIQ API
# Usage: pre-commit install (after installing pre-commit)
#
# Tolérance zéro: tout doit passer avant le commit

repos:
  # Ruff: formatage + linting Python (remplace black + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      # Ruff format (formatage automatique)
      - id: ruff-format
      # Ruff lint (vérifications de code)
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # MyPy: vérification de types
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-passlib, types-python-jose]
        args: [--ignore-missing-imports]
        exclude: ^(tests/|alembic/)

  # Vérification des imports Python
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --check-only]

  # Vérification des fichiers Python (syntaxe)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # Tests unitaires (vérifie que les tests passent)
  # Note: Désactivé si dépendances non installées localement
  # Les tests s'exécutent dans Docker/CI
  # - repo: local
  #   hooks:

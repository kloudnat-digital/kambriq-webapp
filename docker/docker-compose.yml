# ----- KAMBRIQ Local Development Stack -----

# First-time setup (run once after cloning):
#   npm run docker:dev:init        → Start services + apply all migrations + seed data
#
# Regular usage:
#   npm run docker:dev             → Start services (data already present from previous run)
#   npm run docker:down            → Stop services (volumes preserved)
#   npm run docker:dev:reset       → Stop + wipe all volumes (clean slate)
#   npm run docker:dev:logs        → Tail logs from all services
#
# Services:
#   PostgreSQL 16  → localhost:5432  (postgres / password)
#     Databases: kambriq_core  kambriq_kbs  kambriq_kamnet  kambriq_lands
#   Redis 7        → localhost:6379
#   pgAdmin 4      → http://localhost:5050  (admin@kambriq.com / admin)
#
# NOTE: init.sql runs only on first startup (empty pgdata volume).
# To reset completely: npm run docker:dev:reset && npm run docker:dev:init

services:
  # ----- PostgreSQL 16 -----
  db:
    image: postgres:16-alpine
    container_name: kambriq_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kambriq_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Redis 7 -----
  redis:
    image: redis:7-alpine
    container_name: kambriq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- pgAdmin 4 -----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kambriq_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kambriq.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: kambriq_pgdata
  redisdata:
    name: kambriq_redisdata
